<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable en PWA standalone ET en app
         Capacitor — sans lui, les zones de sécurité (encoche, barre
         d'accueil) ne sont pas gérées et le contenu passe dessous. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS : expérience « Ajouter à l'écran d'accueil » / app standalone
         (icône, titre, barre de statut, pas de barre Safari). Ignorés par
         Android et desktop. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowball Pro" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="description"
      content="Snowball Pro — simulateur d'épargne et de patrimoine français : projection du capital, fiscalité (CTO, PEA, AV, PER), Monte Carlo, rente et retraite. Gratuit, données en local, compte optionnel."
    />
    <!-- Open Graph / social preview (partage Reddit, Discord, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snowball-pro.vercel.app" />
    <meta property="og:title" content="Snowball Pro — Simulateur patrimonial français" />
    <meta
      property="og:description"
      content="Projetez votre épargne avec les rendements réels du MSCI World (1970-2025) et 100 ans d'historique, la fiscalité française (CTO, PEA, AV, PER) et Monte Carlo. Gratuit, sans inscription, données en local."
    />
    <meta property="og:image" content="https://snowball-pro.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Snowball Pro — Simulateur patrimonial français" />
    <meta
      name="twitter:description"
      content="Projetez votre épargne avec les rendements réels du MSCI World et 100 ans d'historique, fiscalité française (CTO, PEA, AV, PER), Monte Carlo. Gratuit, sans inscription, données en local."
    />
    <meta name="twitter:image" content="https://snowball-pro.vercel.app/og-image.png" />
    <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)" />
    <title>Snowball Pro — Simulateur patrimonial français gratuit</title>
    <link rel="canonical" href="https://snowball-pro.vercel.app/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <!-- Données structurées SEO (bloc ajouté par BOS le 13 août 2026) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Snowball Pro",
        "url": "https://snowball-pro.vercel.app/",
        "description": "Simulateur d'épargne et de patrimoine français : projection du capital, fiscalité (CTO, PEA, AV, PER), Monte Carlo, rente et retraite. Gratuit, données en local, compte optionnel.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "inLanguage": "fr",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>
    <!-- Données structurées FAQPage (4.1) — les 8 questions de la FAQ de la
         landing, verbatim : c'est la différence entre être cité et être
         ignoré par les AI answers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Mes données sont-elles envoyées sur un serveur ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non. Tout est calculé et stocké dans votre navigateur (localStorage) : aucune donnée ne quitte votre appareil. Un compte crée un espace isolé pour vos simulations sur cet appareil — la synchronisation cloud n'existe pas encore."
            }
          },
          {
            "@type": "Question",
            "name": "Un compte est-il obligatoire ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non, l'application fonctionne intégralement sans compte. Un compte vous permet d'isoler vos simulations de celles des autres utilisateurs de l'appareil et prépare la synchronisation future."
            }
          },
          {
            "@type": "Question",
            "name": "Prudent, Central, Optimiste : c'est quoi la différence ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trois lectures du même historique (MSCI World 1970-2025). L'app applique par défaut le Central : la moyenne géométrique composée (≈ 8,22 %/an), krachs inclus. L'Optimiste est la moyenne arithmétique des années (≈ 10,07 %), le Prudent le rendement réel après inflation (≈ 5,99 %). Comparez votre plan dans les trois mondes — c'est la même échelle que la section Méthodologie."
            }
          },
          {
            "@type": "Question",
            "name": "Pourquoi 10,07 % et pas 6,12 % ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "10,07 % est la moyenne arithmétique des années (scénario Optimiste) ; l'app applique par défaut le Central, 8,22 %/an composé. 6,12 serait la simple soustraction 8,22 − 2,1 : c'est une approximation. La formule exacte de Fisher est (1 + 8,22 %) ÷ (1 + 2,1 %) − 1 = 5,99 %/an réel — le scénario Prudent."
            }
          },
          {
            "@type": "Question",
            "name": "Pourquoi 2,1 % d'inflation et pas la moyenne réelle ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "2,1 % est une hypothèse d'inflation future (proche de la cible BCE de 2 %), pas la moyenne historique : l'inflation française réelle 1970-2025 est de 4,0 % en moyenne, mais cette moyenne est tirée vers le haut par les chocs des années 1970-1985 (jusqu'à 13,7 % en 1974). La médiane de la période est justement 2,1 %, et depuis 1986 la moyenne n'est que de 1,9 % — pour l'avenir, 2,1 % est une hypothèse raisonnable, voire prudente."
            }
          },
          {
            "@type": "Question",
            "name": "Qu'est-ce que Monte Carlo ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Jusqu'à 10 000 scénarios qui rejouent l'historique réel par blocs — krachs et bull markets inclus. Vous obtenez les percentiles P10/P50/P90, la probabilité de succès et l'intervalle de confiance de cette estimation."
            }
          },
          {
            "@type": "Question",
            "name": "Comment est construit l'historique de 100 ans ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "S&P 500 SBBI 1926-1969 (dividendes réinvestis) puis MSCI World 1970-2025 : la période récente est couverte par un indice mondial, l'ancienne par le marché américain, seul indice de référence fiable à l'époque. L'inflation utilisée est la série INSEE française."
            }
          },
          {
            "@type": "Question",
            "name": "L'application est-elle vraiment gratuite ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui. Gratuite, sans engagement et sans carte bancaire — aujourd'hui et demain."
            }
          }
        ]
      }
    </script>
    <!--
      CSP stricte adaptée au build single-file (vite-plugin-singlefile) :
      - script-src 'unsafe-inline' est OBLIGATOIRE car tout le JS est inliné dans index.html.
        La compensation : script-src-attr 'none' (aucun gestionnaire d'événement inline),
        object-src 'none', et aucune origine tierce n'est autorisée pour le script/connect.
      - Ne PAS retirer 'unsafe-inline' sans injecter un hash/nonce au build, sinon l'app casse.
      - EXCEPTION UNIQUE (6 août 2026) : GoatCounter (gc.zgo.at + *.goatcounter.com) pour le
        compteur de visites vie privée-friendly. C'est le seul script/connect tierce autorisé.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self'"
    />
    <!-- Favicon : favicon.ico (16/32/48, requis par Google pour l'icône dans les résultats de recherche) + PNG haute résolution -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Compteur de visites GoatCounter (vie privée-friendly : pas de cookies, pas de données perso).
         ✅ CONFIGURÉ le 13 août 2026 — site code gabriel322jsj222 (compte Gabriel).
         Ne pas retirer : c'est LA mesure du canal SEO/distribution. -->
    <script
      data-goatcounter="https://gabriel322jsj222.goatcounter.com/count"
      data-goatcounter-settings='{"allow_local": false}'
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
